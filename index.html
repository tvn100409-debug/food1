<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지? 룰렛</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#292524;background:#fffaf3}
*{box-sizing:border-box}body{margin:0;padding:24px 14px;display:flex;justify-content:center}
main{width:min(100%,560px)}h1{text-align:center;margin:8px 0 4px;font-size:30px}
.sub{text-align:center;color:#78716c;margin:0 0 22px}
.panel{background:white;border:1px solid #eadfd1;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #7c54200d}
.wheel-wrap{position:relative;max-width:360px;margin:10px auto}
canvas{display:block;width:100%;height:auto}.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:28px;color:#7c3aed;text-shadow:0 1px white}
button,input{font:inherit}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#7c3aed;color:white;font-weight:800;font-size:18px;cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #e7d9c8;border-radius:30px;padding:8px 12px;background:white;cursor:pointer;font-size:14px}
.chip.active{background:#f1eaff;border-color:#9b78ec;color:#5426a8}
.addrow{display:flex;gap:8px}.addrow input{min-width:0;flex:1;padding:11px;border:1px solid #e7d9c8;border-radius:12px}
.addrow button{border:0;border-radius:12px;padding:0 16px;background:#292524;color:white;font-weight:700;cursor:pointer}
#result{text-align:center;min-height:110px;display:grid;place-content:center;gap:8px}
.result-name{font-size:30px;font-weight:850}.muted{color:#78716c;font-size:14px}
h2{font-size:17px;margin:0 0 13px}.history{color:#57534e;font-size:14px;line-height:1.8}
footer{text-align:center;color:#a8a29e;font-size:12px;margin:20px}
</style>
</head>
<body>
<main>
  <h1>🍽️ 오늘 뭐 먹지?</h1>
  <p class="sub">고민은 그만! 룰렛에게 맡겨봐요.</p>
  <section class="panel">
    <h2>🎯 오늘의 메뉴 룰렛</h2>
    <div class="wheel-wrap"><span class="pointer">▼</span><canvas id="wheel" width="680" height="680" aria-label="음식 메뉴 룰렛"></canvas></div>
    <button id="spin" class="primary">🎰 룰렛 돌리기!</button>
    <p class="muted" style="text-align:center;margin-bottom:0">룰렛이 멈추면 오늘의 메뉴가 결정돼요.</p>
  </section>
  <section class="panel" id="result" aria-live="polite">
    <div class="muted">오늘의 추천 메뉴</div><div class="result-name">🤔 아직 결정되지 않았어요!</div>
    <div class="muted">룰렛을 돌려보세요.</div>
  </section>
  <section class="panel">
    <h2>🍴 메뉴 카테고리</h2>
    <div class="chips" id="categories">
      <button class="chip active" data-cat="all">전체</button>
      <button class="chip" data-cat="한식">🇰🇷 한식</button>
      <button class="chip" data-cat="중식">🥢 중식</button>
      <button class="chip" data-cat="일식">🍣 일식</button>
      <button class="chip" data-cat="양식">🍝 양식</button>
      <button class="chip" data-cat="분식">🌶️ 분식</button>
      <button class="chip" data-cat="기타">🍔 기타</button>
    </div>
    <h2 style="margin-top:22px">📝 메뉴 직접 추가하기</h2>
    <div class="addrow"><input id="new-menu" maxlength="20" placeholder="예: 닭갈비 입력"><button id="add">추가</button></div>
    <div class="chips" id="menu-list" style="margin-top:13px"></div>
    <p class="muted">메뉴를 누르면 룰렛 포함 여부를 바꿀 수 있어요.</p>
  </section>
  <section class="panel">
    <h2>🏆 최근 당첨 메뉴</h2><div id="history" class="history">아직 기록이 없어요.</div>
    <button id="clear-history" class="chip" style="margin-top:12px">기록 초기화</button>
  </section>
  <footer>오늘도 맛있는 한 끼 되세요! ❤️</footer>
</main>
<script>
(()=>{
 const initial=[
  ['김치찌개','한식','🍲'],['제육볶음','한식','🥘'],['삼겹살','한식','🥓'],['비빔밥','한식','🥗'],
  ['돈까스','일식','🍛'],['초밥','일식','🍣'],['마라탕','중식','🌶️'],['짜장면','중식','🍜'],
  ['짬뽕','중식','🍜'],['파스타','양식','🍝'],['피자','양식','🍕'],['떡볶이','분식','🌶️']
 ];
 let foods=initial.map((x,i)=>({id:i,name:x[0],cat:x[1],emoji:x[2],on:true}));
 let category='all',rotation=0,busy=false,history=[];
 const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
 const colors=['#F59E8B','#F6C66A','#91B9A0','#92B9D9','#C0A4D9','#E8A7B6','#D4B77C','#83C4BB'];
 const $=id=>document.getElementById(id);
 function activeFoods(){return foods.filter(f=>f.on&&(category==='all'||f.cat===category))}
 function draw(){
  const active=activeFoods(),n=active.length,c=340;ctx.clearRect(0,0,680,680);ctx.save();ctx.translate(c,c);
  if(!n){ctx.beginPath();ctx.arc(0,0,310,0,Math.PI*2);ctx.fillStyle='#eee';ctx.fill();ctx.fillStyle='#555';ctx.font='bold 25px sans-serif';ctx.textAlign='center';ctx.fillText('메뉴를 선택해 주세요',0,8)}
  active.forEach((f,i)=>{
   const a=rotation-Math.PI/2+i*2*Math.PI/n,b=a+2*Math.PI/n;
   ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,310,a,b);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=4;ctx.stroke();
   ctx.save();ctx.rotate(a+Math.PI/n);ctx.textAlign='right';ctx.fillStyle='#382D29';ctx.font='bold '+(n>10?21:n>7?24:29)+'px sans-serif';ctx.fillText(f.emoji+' '+f.name,275,9,220);ctx.restore();
  });
  ctx.beginPath();ctx.arc(0,0,45,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#D6B36A';ctx.lineWidth=6;ctx.stroke();ctx.fillStyle='#76512B';ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillText('GO',0,7);ctx.restore();
 }
 function renderList(){
  const list=$('menu-list');list.innerHTML='';
  foods.forEach(f=>{const b=document.createElement('button');b.className='chip'+(f.on?' active':'');b.textContent=(f.on?'✓ ':'× ')+f.emoji+' '+f.name;b.style.opacity=f.on?'1':'.45';b.onclick=()=>{f.on=!f.on;renderList();draw()};list.append(b)});
 }
 function showResult(f){
  $('result').innerHTML='';
  const label=document.createElement('div');label.className='muted';label.textContent='🎉 오늘의 당첨 메뉴!';
  const name=document.createElement('div');name.className='result-name';name.textContent=f.emoji+' '+f.name;
  const desc=document.createElement('div');desc.className='muted';desc.textContent='오늘은 이 메뉴로 결정! 맛있게 드세요 ❤️';
  const again=document.createElement('button');again.className='chip';again.textContent='🔄 다시 뽑기';again.onclick=spin;
  $('result').append(label,name,desc,again);
 }
 function spin(){
  if(busy)return;const active=activeFoods();
  if(!active.length){$('result').textContent='메뉴를 하나 이상 선택해주세요!';return}
  busy=true;$('spin').disabled=true;$('spin').textContent='🎰 돌리는 중...';
  const index=Math.floor(Math.random()*active.length),slice=2*Math.PI/active.length;
  const target=-Math.PI/2-(index+.5)*slice;
  const diff=(target-rotation%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const start=rotation,end=rotation+Math.PI*2*6+diff,t0=performance.now(),duration=4300;
  function frame(now){
   const p=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-p,4);rotation=start+(end-start)*ease;draw();
   if(p<1)requestAnimationFrame(frame);else{
    rotation=end%(2*Math.PI);draw();busy=false;$('spin').disabled=false;$('spin').textContent='🎰 다시 돌리기!';
    const winner=active[index];showResult(winner);history.unshift(winner);history=history.slice(0,5);
    $('history').textContent=history.map((f,i)=>(i+1)+'. '+f.emoji+' '+f.name).join('  ·  ');
   }
  }requestAnimationFrame(frame);
 }
 $('spin').onclick=spin;
 $('add').onclick=()=>{
  const input=$('new-menu'),name=input.value.trim();if(!name)return;
  if(foods.some(f=>f.name===name)){alert('이미 등록된 메뉴예요.');return}
  foods.push({id:Date.now(),name,cat:category==='all'?'기타':category,emoji:'🍴',on:true});input.value='';renderList();draw();
 };
 $('new-menu').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
 $('categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  category=b.dataset.cat;$('categories').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));draw();
 });
 $('clear-history').onclick=()=>{history=[];$('history').textContent='아직 기록이 없어요.'};
 renderList();draw();
})();
</script>
</body>
</html>
